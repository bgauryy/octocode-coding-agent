compressionLevel: 0

enableGlobalCache: true

# Keep published dependencies on their published core version. The host itself
# explicitly depends on the workspace core for SYSTEM_PROMPT, while tools-core
# must resolve the npm core it was built and tested against.
enableTransparentWorkspaces: false

enableTelemetry: false

nodeLinker: node-modules

npmRegistryServer: "https://registry.npmjs.org/"

yarnPath: .yarn/releases/yarn-4.9.1.cjs
