# Builds the agent and runs its checks, suites, e2e and a packed-install smoke on Linux, macOS and Windows, on the
# Node versions Octocode supports (engines floor 24.15.0; 26 is the current LTS).
#
# coding-agent links packages from sibling repositories (`link:../../../octocode/...` and
# `link:../../../octocode-sandbox-runtime`), so they are checked out beside this repository, as on a developer machine
# (DEVELOPMENT.md). `octocode-sandbox-runtime` is private: add a repository secret `SIBLING_REPOS_TOKEN` (a token with
# read access to both sibling repositories). The sibling packages are built before `yarn install`.
name: agent-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: octocodecode
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          path: octocodecode
      - uses: actions/checkout@v4
        with:
          repository: bgauryy/octocode
          ref: octocode-20.0.0
          path: octocode
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: bgauryy/octocode-sandbox-runtime
          ref: octocode
          path: octocode-sandbox-runtime
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable

      # Sibling packages the `link:` dependencies point at. The fork's prebuilt helpers (seccomp, srt-win, Java proxy
      # agent) are git-ignored; they come from the matching upstream npm release (its FORK.md, "Building a local
      # copy"), whose version is the fork's version without the `-octocode.<n>` suffix. The build and the publish check
      # fail when one is missing.
      - name: Build octocode-sandbox-runtime
        working-directory: octocode-sandbox-runtime
        run: |
          npm ci
          npm run build
          base=$(node -p "require('./package.json').version.replace(/-octocode\..*$/, '')")
          dir=$(mktemp -d)
          npm pack "@anthropic-ai/sandbox-runtime@$base" --pack-destination "$dir"
          tar -xzf "$dir"/anthropic-ai-sandbox-runtime-"$base".tgz -C "$dir"
          for d in seccomp/x64 seccomp/arm64 srt-win/x64 srt-win/arm64 java-proxy-agent; do
            mkdir -p "vendor/$d"
            cp "$dir/package/vendor/$d"/* "vendor/$d/"
          done
      - name: Build octocode packages
        working-directory: octocode
        run: |
          yarn install --immutable
          yarn build:dev
          yarn workspace octocode-mcp build
          yarn workspace octocode build
          yarn workspace @octocodeai/octocode-chrome-devtools build

      - run: yarn install --immutable
      # The model-data generator imports the built contracts package.
      - run: yarn workspace @octocodeai/octocode-contracts run build
      - run: yarn run hydrate:model-data
      - run: yarn run build:offline

      # Every check script is plain Node or a Node-run tool, and .gitattributes pins LF, so all three systems run them.
      - name: yarn run check
        shell: bash
        run: yarn run check

      - name: Native suite
        working-directory: octocodecode/packages/coding-agent
        run: yarn vitest run --config vitest.octocode.config.ts
      - name: Core suite
        working-directory: octocodecode/packages/coding-agent
        run: yarn vitest run
      - name: End-to-end
        run: yarn workspace @octocodeai/octocode-agent run test:e2e

      # Packs every package, installs each into an empty folder and starts the installed bin.
      - name: Pack-install smoke
        run: yarn run check:package-install
