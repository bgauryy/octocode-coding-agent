compressionLevel: 0

enableGlobalCache: true

enableTelemetry: false

nodeLinker: node-modules

npmRegistryServer: "https://registry.npmjs.org/"

# Octocode's own npm scope skips Yarn's 24-hour age gate on fresh releases; every other package keeps it.
npmPreapprovedPackages:
  - "@octocodeai/*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# `npm run audit` fails on production advisories of moderate severity or higher. A reviewed advisory that does not apply
# goes here by ID, with a comment naming the package and why it does not apply; remove it once a fixed version is installed.
npmAuditIgnoreAdvisories: []
